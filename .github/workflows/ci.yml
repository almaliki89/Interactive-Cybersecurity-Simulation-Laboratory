name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build application
        run: bun run build

  visual-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Arabic Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Visual QA tests
        run: bun run test:e2e

      # Diagnostic reports upload: only uploads on failure to preserve storage quota.
      # If repository storage quota is exhausted, continue-on-error ensures diagnostic upload
      # issues do not fail an otherwise passing test, while failed tests remain strictly blocking.
      - name: Upload E2E Test Reports & Diagnostic Traces (On Failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1
